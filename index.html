<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encontro Infield 2026 · Boas-vindas</title>
<!--
  Widget de vídeo · Embed widgets da SpotMe (Backstage → Design → Home → Home feed)
  Caixa fixa de 220 px de altura, largura automática, sem interação.
  Vídeo: v6 (33,8 s) · 960x540 · H.264 Main · sem áudio · loop.
  Arquivos (mesmo diretório, flat): index.html · boas-vindas.mp4 · poster.jpg
-->
<style>
  :root { --bg: #FFFFFF; --red: #E1242A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E2A38; } }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg);
    -webkit-user-select: none; user-select: none;
  }
  .widget {
    position: relative; width: 100%; height: 100%; max-height: 220px;
    overflow: hidden; background: #FDFDFD;
  }
  .widget::before {                /* barra superior Takeda — mesma assinatura do widget de clima */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: var(--red); z-index: 2;
  }
  video, .poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    pointer-events: none; display: block;
  }
  .poster { z-index: 1; transition: opacity .4s ease; }
  .playing .poster { opacity: 0; }
</style>
</head>
<body>
<div class="widget" id="w">
  <video id="v" src="boas-vindas.mp4" poster="poster.jpg"
         autoplay muted loop playsinline webkit-playsinline preload="auto"
         disablepictureinpicture disableremoteplayback></video>
  <img class="poster" src="poster.jpg" alt="Encontro Infield 2026 · Futuro Infield em Foco">
</div>
<script>
  (function () {
    var v = document.getElementById('v'), w = document.getElementById('w');
    v.muted = true; v.defaultMuted = true;
    function show() { w.classList.add('playing'); }
    function play() { var p = v.play(); if (p && p.then) p.then(show).catch(function () {}); }
    v.addEventListener('playing', show);
    v.addEventListener('timeupdate', function () { if (v.currentTime > 0) show(); });
    v.addEventListener('loadeddata', play);
    v.addEventListener('canplay', play);
    v.addEventListener('error', function () { w.classList.remove('playing'); });   // falha → fica o pôster
    document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
    ['touchstart', 'click'].forEach(function (e) { document.addEventListener(e, play, { once: true }); });   // reforço se o sistema bloquear o autoplay
    play();
  })();
</script>
</body>
</html>
